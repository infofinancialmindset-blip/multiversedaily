        name: "format"
        widget: "select"
        default: "film"
        options:
          - { label: "Film", value: "film" }
          - { label: "Serie TV", value: "serie" }
          - { label: "Nessuno dei due", value: "altro" }
      - { label: "Nota", name: "note", widget: "string", required: false, hint: "Es. \"Al cinema\", \"Su Disney+\", \"Data non confermata\"" }
      - { label: "Descrizione", name: "description", widget: "text", required: false }
      - { label: "Link a un articolo", name: "link", widget: "string", required: false, hint: "Es. /news/nome-articolo" }
