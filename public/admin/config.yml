      - label: "Formato"
        name: "format"
        widget: "select"
        default: "altro"
        hint: "Decide se compare nella sezione Film o Serie TV"
        options:
          - { label: "Film", value: "film" }
          - { label: "Serie TV", value: "serie" }
          - { label: "Nessuno dei due", value: "altro" }
      - { label: "Data prima pubblicazione", name: "publishedAt", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Data ultimo aggiornamento", name: "updatedAt", widget: "datetime", format: "YYYY-MM-DD", hint: "Aggiorna questa data ogni volta che modifichi la guida" }
