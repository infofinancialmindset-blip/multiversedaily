  - name: "uscite"
    label: "Calendario uscite"
    folder: "content/uscite"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    summary: "{{title}} — {{releaseDate}}"
    sortable_fields: ["releaseDate", "title"]
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data di uscita", name: "releaseDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: "Universo"
        name: "universe"
        widget: "select"
        default: "mcu"
        options:
          - { label: "MCU (Marvel)", value: "mcu" }
          - { label: "DC Universe", value: "dc" }
          - { label: "Altri cinecomics", value: "altro" }
