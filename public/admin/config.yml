backend:
  name: github
  repo: infofinancialmindset-blip/multiversedaily
  branch: main
  # Senza base_url, Decap userebbe il suo default (https://api.netlify.com) e
  # il login finirebbe su un "Not Found". Qui puntiamo al nostro dominio, dove
  # vivono le route /api/auth e /api/callback che gestiscono l'OAuth GitHub.
  base_url: https://www.multiversedaily.it
  auth_endpoint: api/auth

# Scrittura in locale: quando apri /admin da localhost, Decap parla con il
# proxy avviato da `npm run cms` e salva direttamente nei file del progetto,
# senza login GitHub. In produzione questa riga viene ignorata e si usa il
# backend github qui sopra.
local_backend: true

# Anteprima delle bozze: pubblica direttamente su main.
# Passa a true se preferisci passare da Pull Request per ogni articolo.
publish_mode: simple

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Nota: i campi "Universo" e "Formato" presenti in ogni collection decidono in
# quali sezioni del sito compare il contenuto (MCU, DC Universe, Film, Serie TV).
# Sono ripetuti per esteso in ogni collection perché lo YAML non permette di
# riusare una lista di campi senza annidarla.

collections:
  - name: "news"
    label: "News"
    folder: "content/articles/news"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - { label: "Autore", name: "author", widget: "string", default: "Redazione" }
      - label: "Universo"
        name: "universe"
        widget: "select"
        default: "mcu"
        hint: "Decide se compare nella sezione MCU o DC Universe"
        options:
          - { label: "MCU (Marvel)", value: "mcu" }
          - { label: "DC Universe", value: "dc" }
          - { label: "Altri cinecomics", value: "altro" }
      - label: "Formato"
        name: "format"
        widget: "select"
        default: "film"
        hint: "Decide se compare nella sezione Film o Serie TV"
        options:
          - { label: "Film", value: "film" }
          - { label: "Serie TV", value: "serie" }
          - { label: "Nessuno dei due", value: "altro" }
      - { label: "Data pubblicazione", name: "publishedAt", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Data aggiornamento", name: "updatedAt", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "Immagine di copertina", name: "coverImage", widget: "image", required: false }
      - label: "Inquadratura copertina"
        name: "coverPosition"
        widget: "select"
        default: "center"
        required: false
        hint: "Quale parte della foto resta visibile nel ritaglio. Usa Alto se l'immagine contiene volti in cima."
        options:
          - { label: "Centro (predefinito)", value: "center" }
          - { label: "Alto", value: "top" }
          - { label: "Basso", value: "bottom" }
      - { label: "In evidenza in home", name: "featured", widget: "boolean", default: false }
      - label: "Posizione in home"
        name: "featuredOrder"
        widget: "number"
        value_type: "int"
        min: 1
        required: false
        hint: "Solo se \"In evidenza\" è attivo. 1 = articolo grande in cima, 2, 3, 4 = riquadri laterali. Lascia vuoto per ordinare per data."
      - { label: "Tag", name: "tags", widget: "list", default: [] }
      - { label: "Contenuto", name: "body", widget: "markdown" }

  - name: "leak"
    label: "Leak & Rumor"
    folder: "content/articles/leak"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - { label: "Autore", name: "author", widget: "string", default: "Redazione" }
      - label: "Affidabilità"
        name: "reliability"
        widget: "select"
        default: "media"
        required: false
        hint: "Mostrato ai lettori come indicatore grafico. Dichiararlo distingue il sito da chi rilancia ogni voce come confermata."
        options:
          - { label: "Alta — fonte storicamente accurata o più riscontri", value: "alta" }
          - { label: "Media — plausibile ma non verificabile", value: "media" }
          - { label: "Bassa — voce non verificata, probabilmente infondata", value: "bassa" }
      - label: "Universo"
        name: "universe"
        widget: "select"
        default: "mcu"
        hint: "Decide se compare nella sezione MCU o DC Universe"
        options:
          - { label: "MCU (Marvel)", value: "mcu" }
          - { label: "DC Universe", value: "dc" }
          - { label: "Altri cinecomics", value: "altro" }
      - label: "Formato"
        name: "format"
        widget: "select"
        default: "film"
        hint: "Decide se compare nella sezione Film o Serie TV"
        options:
          - { label: "Film", value: "film" }
          - { label: "Serie TV", value: "serie" }
          - { label: "Nessuno dei due", value: "altro" }
      - { label: "Data pubblicazione", name: "publishedAt", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Data aggiornamento", name: "updatedAt", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "Immagine di copertina", name: "coverImage", widget: "image", required: false }
      - label: "Inquadratura copertina"
        name: "coverPosition"
        widget: "select"
        default: "center"
        required: false
        hint: "Quale parte della foto resta visibile nel ritaglio. Usa Alto se l'immagine contiene volti in cima."
        options:
          - { label: "Centro (predefinito)", value: "center" }
          - { label: "Alto", value: "top" }
          - { label: "Basso", value: "bottom" }
      - { label: "In evidenza in home", name: "featured", widget: "boolean", default: false }
      - label: "Posizione in home"
        name: "featuredOrder"
        widget: "number"
        value_type: "int"
        min: 1
        required: false
        hint: "Solo se \"In evidenza\" è attivo. 1 = articolo grande in cima, 2, 3, 4 = riquadri laterali. Lascia vuoto per ordinare per data."
      - { label: "Tag", name: "tags", widget: "list", default: [] }
      - label: "Contenuto"
        name: "body"
        widget: "markdown"
        hint: "Indica sempre il livello di affidabilità del leak all'inizio dell'articolo"

  - name: "teorie"
